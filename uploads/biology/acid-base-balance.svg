<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
<title id="t">Acid–Base Balance Calculator (ABG) — results compared</title>
<desc id="d">Acid–Base Balance Calculator (ABG): Measured CO₂ against what Winter&#x27;s formula predicts. — Anion gap = 21; Albumin-corrected gap = 111; Expected PaCO₂ (Winter&#x27;s formula) = 29; Base excess estimate = -10.38; Measured minus Winter-predicted PaCO2 = -1.</desc>
<style>
  .lbl { font: 600 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #0f172a; }
  .val { font: 700 17px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #0f172a; }
  .small { font: 500 11px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #64748b; }
  .tag { font: 600 11px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #2563eb;
         letter-spacing: .06em; text-transform: uppercase; }
  .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
  .boxout { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
  .arrow { stroke: #cbd5e1; stroke-width: 2; fill: none; }
  .flow { stroke: #0ea5e9; stroke-width: 2; fill: none; stroke-dasharray: 5 7; animation: dash 1.6s linear infinite; }
  .grow { transform-box: fill-box; transform-origin: bottom; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fade 1s ease both; }
  .slide { animation: slide 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .widen { transform-box: fill-box; transform-origin: left; animation: widen .8s cubic-bezier(.2,.8,.2,1) both; }
  .sweep { animation: sweepdown 3.2s cubic-bezier(.4,0,.6,1) infinite; }
  .tick { font: 700 12px ui-monospace, 'SF Mono', Menlo, monospace; fill: #64748b; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  @keyframes rise { from { transform: scaleY(.05); opacity: .2; } to { transform: scaleY(1); opacity: 1; } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slide { from { transform: translateX(-14px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes widen { from { transform: scaleX(.02); opacity: .25 } to { transform: scaleX(1); opacity: 1 } }
  /* The band is a hint that the list is being read top to bottom, not data: it
     stays translucent so a screenshot taken mid-animation can never be mistaken
     for another bar in the chart. */
  @keyframes sweepdown { 0% { transform: translateY(0); opacity: 0 }
                         15% { opacity: .16 }
                         85% { opacity: .16 }
                         100% { transform: translateY(156px); opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .grow, .fade, .slide, .pulse, .widen, .sweep { animation: none; }
  }
</style>
<rect width="720" height="300" fill="#ffffff"/>
<text class="tag" x="28" y="32">Measured CO₂ against what Winter&#x27;s formula predicts.</text>
<rect class="grow" style="animation-delay:0.00s" x="80.0" y="181.6" width="62.7" height="28.4" rx="6" fill="#2563eb" opacity="0.9"/>
<text class="val" x="111.4" y="171.6" text-anchor="middle">21</text>
<text class="small" x="111.4" y="232" text-anchor="middle"><tspan x="111.4" dy="0">Anion gap</tspan></text>
<rect class="grow" style="animation-delay:0.10s" x="192.0" y="60.0" width="62.7" height="150.0" rx="6" fill="#2563eb" opacity="0.9"/>
<text class="val" x="223.4" y="50.0" text-anchor="middle">111</text>
<text class="small" x="223.4" y="232" text-anchor="middle"><tspan x="223.4" dy="0">Albumin-corrected</tspan><tspan x="223.4" dy="13">gap</tspan></text>
<rect class="grow" style="animation-delay:0.20s" x="304.0" y="170.8" width="62.7" height="39.2" rx="6" fill="#2563eb" opacity="0.9"/>
<text class="val" x="335.4" y="160.8" text-anchor="middle">29</text>
<text class="small" x="335.4" y="232" text-anchor="middle"><tspan x="335.4" dy="0">Expected PaCO₂</tspan><tspan x="335.4" dy="13">(Winter&#x27;s…</tspan></text>
<rect class="grow" style="animation-delay:0.30s" x="416.0" y="196.0" width="62.7" height="14.0" rx="6" fill="#2563eb" opacity="0.9"/>
<text class="val" x="447.4" y="186.0" text-anchor="middle">-10.38</text>
<text class="small" x="447.4" y="232" text-anchor="middle"><tspan x="447.4" dy="0">Base excess</tspan><tspan x="447.4" dy="13">estimate</tspan></text>
<rect class="grow" style="animation-delay:0.40s" x="528.0" y="208.6" width="62.7" height="1.4" rx="6" fill="#2563eb" opacity="0.9"/>
<text class="val" x="559.4" y="198.6" text-anchor="middle">-1</text>
<text class="small" x="559.4" y="232" text-anchor="middle"><tspan x="559.4" dy="0">Measured minus</tspan><tspan x="559.4" dy="13">Winter-predicte…</tspan></text>
<line x1="60" y1="210" x2="660" y2="210" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>
